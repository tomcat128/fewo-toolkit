; Einstellungen für das lokale Testprojekt
date.timezone = Europe/Berlin
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
; Quelltext-Änderungen am Paket sofort wirksam
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; Warnungen und Deprecations landen in `docker compose logs web`
log_errors = On
display_errors = Off
